# A throwaway MPD for testing music-hub: no music folder, no sound card.
# Streams are "played" into a null output, so nothing is heard.
bind_to_address "127.0.0.1"
port "16601"
playlist_directory "/tmp/mpd/playlists"
state_file "/tmp/mpd/state"
log_file "/dev/stdout"
audio_output {
    type "null"
    name "test null output"
}
