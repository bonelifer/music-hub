name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: unittest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install flake8
        run: python -m pip install flake8
      - name: Lint
        run: python -m flake8 --max-line-length 100 *.py tests/*.py tools/*.py
      - name: Check the example config
        run: python music_hub.py check-config --config music-hub.cfg.example
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n tools/test-mpd.sh
